name: Build & Release

# Every push / PR: build both apps (a compile check).
# Tag v* (e.g. `git tag v1.0 && git push --tags`): also publish a GitHub Release
# with LifeDots-android.apk and LifeDots-macOS.zip attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The repo has no Gradle wrapper jar; install the exact Gradle version instead.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: APK is debug-signed and cannot update installed copies."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          # versionCode must only ever increase, so use the workflow run number.
          gradle assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LifeDots-android.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: ${{ runner.temp }}/LifeDots-android.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          UNIVERSAL=1 VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build.sh
          lipo -info build/LifeDots.app/Contents/MacOS/LifeDots
          # ditto keeps the code signature intact (plain zip can break it).
          ditto -c -k --keepParent build/LifeDots.app "$RUNNER_TEMP/LifeDots-macOS.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: ${{ runner.temp }}/LifeDots-macOS.zip
          if-no-files-found: error

  ios:
    name: iOS app (compile check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        run: ./generate.sh --no-open

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild -project LifeDots.xcodeproj -scheme LifeDots \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Android (8.1+)**: on your phone, download **LifeDots-android.apk** below and open it. If asked, allow your browser to install apps. Then open LifeDots, set your birthday and tap **Set as wallpaper**.

            **macOS (13+)**: download **LifeDots-macOS.zip**, double-click it, drag **LifeDots** into Applications and open it. If macOS says it can't verify the app, go to **System Settings → Privacy & Security** and click **Open Anyway**.
