# XcodeGen spec. Run ./generate.sh to create LifeDots.xcodeproj (not committed).
name: LifeDots
options:
  bundleIdPrefix: io.github.ayush3401
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  LifeDots:
    type: application
    platform: iOS
    sources:
      - LifeDots
      - Shared
    info:
      path: LifeDots/Info.plist
      properties:
        CFBundleDisplayName: LifeDots
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: LifeDots saves the wallpaper image to your photo library so you can set it as your wallpaper.
    entitlements:
      path: LifeDots/LifeDots.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.ayush3401.lifedots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ayush3401.lifedots
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LifeDotsWidget
    scheme: {}

  LifeDotsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LifeDots
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.ayush3401.lifedots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ayush3401.lifedots.widget
